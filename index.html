        recovery: log ? log.recovery : null,
        notes: log ? (log.notes || '') : ''
      };
    });

    return {
      logs,
      sessions: sessionsMap,
      reassess: Database.services.getReassessAnswers()
    };
  }

  const get = () => buildLegacyView();
  const subscribe = (fn) => { subs.push(fn); return () => { const i = subs.indexOf(fn); if (i >= 0) subs.splice(i, 1); }; };

  // Same action surface as before — calls delegate into Database services
  const actions = {
    // Weekly check-ins
    addLog(entry) { Database.services.addCheckin(entry); },
    deleteLog(idx) {
      // Old call site uses array index; we translate to id via current ordered list
      const ordered = Database.services.listCheckins().slice().reverse(); // legacy view sorted desc-by-date typically — but our buildLegacyView sorts ascending; recipient sorts descending themselves. To avoid breakage, use the same order as buildLegacyView output.
      const view = buildLegacyView().logs;
      const record = view[idx];
      if (record && record._id) Database.tables.weeklyCheckins.remove(record._id);
    },

    // Sessions
    getSession(templateRef) {
      const map = buildLegacyView().sessions;
      return map[templateRef] || null;
    },
    startSession(templateRef) { Database.services.startSession(templateRef); },
    completeSession(templateRef, payload) { Database.services.completeSession(templateRef, payload); },
    uncompleteSession(templateRef) { Database.services.uncompleteSession(templateRef); },
    toggleSession(templateRef) {
      const s = buildLegacyView().sessions[templateRef];
      if (s && s.completed) Database.services.uncompleteSession(templateRef);
      else Database.services.completeSession(templateRef, {});
    },

    // Reassessment
    setReassess(qid, value) { Database.services.setReassessAnswer(qid, value); },

    // Bulk
    replaceAll({ logs, sessions, reassess } = {}) {
      // Legacy import path — wrap into v3-shape import and let Database migrate
      Database.services.importAll({ logs, sessions, reassess });
    },

   MODULE: UTILS
   ============================================================ */
const Utils = {
  escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  chevronRight: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`,
  weekKey(phaseId, weekNum, sessionIdx) { return `p${phaseId}_wk${weekNum}_s${sessionIdx}`; },
  // Count completed sessions across the whole sessions object (handles legacy `true` + new objects)
  countCompleted(sessionsObj) {
    return Object.values(sessionsObj).filter(v => {
      if (v === true) return true;
      if (v && typeof v === 'object') return v.completed === true;
      return false;
    }).length;
  },
  formatDuration(startISO, endISO) {
    if (!startISO || !endISO) return '';
    const ms = new Date(endISO) - new Date(startISO);
    if (ms < 0 || !isFinite(ms)) return '';
    const m = Math.floor(ms / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    return m + 'm ' + s.toString().padStart(2, '0') + 's';
  }
};

/* ============================================================
   MODULE: ROUTER — stack-based navigation with transitions
   ============================================================ */
const Router = (() => {
  const stack = []; // [{ screenId, ctx, title }]
  let currentEl = null;
  let transitioning = false;

  function renderScreen(entry, direction) {
    const screen = Screens[entry.screenId];
    if (!screen) { console.warn('Unknown screen:', entry.screenId); return; }

    const el = document.createElement('div');
    el.className = 'screen';
    el.dataset.screen = entry.screenId;
    el.innerHTML = `<div class="screen-pad">${screen.render(entry.ctx || {})}</div>`;

    if (direction === 'push') el.classList.add('enter-from-right');
    document.getElementById('stack').appendChild(el);

    // Force reflow so animation runs
    el.getBoundingClientRect();

    if (direction === 'push') {
      el.classList.remove('enter-from-right');
      if (currentEl) currentEl.classList.add('exit-to-left');
    } else if (direction === 'pop') {
      if (currentEl) currentEl.classList.add('exit-to-right');
    }

    // After transition, clean up old screen
    const prev = currentEl;
    setTimeout(() => {
      if (prev && prev !== el) prev.remove();
      transitioning = false;
      if (screen.onShow) screen.onShow(entry.ctx || {}, el);
    }, direction === 'replace' ? 0 : 300);

    currentEl = el;
    updateTopBar(entry.title, stack.length > 1);
    updateTabBar(entry.screenId, entry.ctx);
    attachScrollListener(el);
  }

  function attachScrollListener(el) {
    const topbar = document.getElementById('topbar');
    el.addEventListener('scroll', () => {
      if (el.scrollTop > 4) topbar.classList.add('elevated');
      else topbar.classList.remove('elevated');
    });
  }

  function push(screenId, ctx = {}, title) {
    if (transitioning) return;
    transitioning = true;
    const entry = { screenId, ctx, title: title || Screens[screenId]?.title || screenId };
    stack.push(entry);
    history.pushState({ depth: stack.length }, '', '#' + screenId);
    renderScreen(entry, 'push');
  }

  function pop() {
    if (transitioning || stack.length <= 1) return;
    transitioning = true;
    stack.pop();
    history.back();
    const entry = stack[stack.length - 1];
    renderScreen(entry, 'pop');
  }

  function switchTab(tabId) {
    if (transitioning) return;
    if (stack.length === 1 && stack[0].screenId === tabId) {
      // already on this tab — scroll to top
      if (currentEl) currentEl.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    transitioning = true;
    stack.length = 0;
    const entry = { screenId: tabId, ctx: {}, title: Screens[tabId]?.title || tabId };
    stack.push(entry);
    history.replaceState({ depth: 1 }, '', '#' + tabId);
    renderScreen(entry, 'replace');
  }

  function refresh() {
    // Re-render current screen with same context
    if (!stack.length) return;
    const entry = stack[stack.length - 1];
    const screen = Screens[entry.screenId];
    if (!screen || !currentEl) return;
    currentEl.innerHTML = `<div class="screen-pad">${screen.render(entry.ctx || {})}</div>`;
    if (screen.onShow) screen.onShow(entry.ctx || {}, currentEl);
  }

  function updateTopBar(title, hasBack) {
    document.getElementById('topbar-title').textContent = title || '';
    const back = document.getElementById('btn-back');
    back.style.visibility = hasBack ? 'visible' : 'hidden';
  }

  function updateTabBar(currentScreen, ctx) {
    const tabMap = { home: 'home', phases: 'phases', 'phase-detail': 'phases', 'week-detail': 'phases', 'session-detail': 'phases', tracking: 'tracking', 'checkin': 'tracking', 'metrics': 'tracking', 'trends': 'tracking', 'log': 'tracking', profile: 'profile', overview: 'profile', decisions: 'profile', principles: 'profile', reassess: 'profile', settings: 'settings' };
    const activeTab = tabMap[currentScreen] || 'home';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
  }

  // Browser back button
  window.addEventListener('popstate', (e) => {
    if (stack.length > 1) {
      stack.pop();
      const entry = stack[stack.length - 1];
      renderScreen(entry, 'pop');
    }
  });

  return { push, pop, switchTab, refresh, getStack: () => stack };
})();

      <div class="eyebrow">Phase ${phase.id} · Week ${week.num}</div>

      <div class="sub">${Utils.escapeHtml(sess.duration)}</div>

      </div>

          <li><span class="k">RPE 7</span><span class="v">3 reps in reserve</span></li>
          <li><span class="k">RPE 8</span><span class="v">2 reps in reserve</span></li>

        </ul>
      </div>
    `;
  },
  _showForm: false,
  _ratingState: { quality: null, energy: null, recovery: null },
  _lastKey: null,
  onShow(ctx, el) {
    const key = Utils.weekKey(ctx.phaseId, ctx.weekNum, ctx.sessionIdx);
    // Reset transient form state when entering a new session
    if (Screens['session-detail']._lastKey !== key) {
      Screens['session-detail']._showForm = false;
      Screens['session-detail']._ratingState = { quality: null, energy: null, recovery: null };
      Screens['session-detail']._lastKey = key;
    }
    // Render rating selectors if the form is shown
    if (Screens['session-detail']._showForm) {
      ['quality','energy','recovery'].forEach(field => {
        const host = el.querySelector('#rate-' + field);
        if (!host) return;
        host.innerHTML = [1,2,3,4,5].map(n => {
          const sel = Screens['session-detail']._ratingState[field] === n ? ' selected' : '';
          return `<button type="button" class="rating-btn${sel}" data-field="${field}" data-val="${n}">${n}</button>`;
        }).join('');
        host.querySelectorAll('.rating-btn').forEach(b => b.addEventListener('click', () => {
          Screens['session-detail']._ratingState[b.dataset.field] = parseInt(b.dataset.val);
          host.querySelectorAll('.rating-btn').forEach(x => x.classList.remove('selected'));
          b.classList.add('selected');
        }));
      });
    }
    // Elapsed-time ticker for in-progress sessions
    const sd = SessionHelper.data(key);
    if (sd && sd.startedAt && !sd.completed) {
      const tick = () => {
        const elapsed = el.querySelector('#elapsed-text');
        if (!elapsed) return;
        const ms = Date.now() - new Date(sd.startedAt).getTime();
        const m = Math.floor(ms / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        elapsed.textContent = m + 'm ' + s.toString().padStart(2, '0') + 's';
        if (el.isConnected) setTimeout(tick, 1000);
      };
      tick();
    }
  },
  submit(key) {
    const r = Screens['session-detail']._ratingState;
    const notes = document.getElementById('ses-notes')?.value || '';
    State.actions.completeSession(key, {
      quality: r.quality,
      energy: r.energy,
      recovery: r.recovery,
      notes
    });
    // Reset transient form state
    Screens['session-detail']._showForm = false;
    Screens['session-detail']._ratingState = { quality: null, energy: null, recovery: null };
    Screens['session-detail']._lastKey = null;
    Router.refresh();
  }
};

Screens.metrics = {

  render() {

    const latest = sorted[sorted.length-1];
    const first = sorted[0];

    let bwDelta = 'vs. baseline', bwClass = '';
    if (latest && first && first !== latest && first.bw && latest.bw) {
      const d = (parseFloat(latest.bw) - parseFloat(first.bw)).toFixed(1);

    const sleepNums = sorted.slice(-4).map(l => parseFloat(l.sleep)).filter(n => !isNaN(n));

Screens.trends = {
  title: 'Trends',
  range: 'all',
  render() {
    const range = this.range;
    return `
      <div class="eyebrow">§ 04 · C</div>
      <h1 class="h1">Trends</h1>
      <div class="sub">Direction beats single readings.</div>

      <div class="chart-filter">
        <button class="${range==='4w'?'active':''}" onclick="Screens.trends.setRange('4w')">4 wks</button>
        <button class="${range==='12w'?'active':''}" onclick="Screens.trends.setRange('12w')">12 wks</button>
        <button class="${range==='all'?'active':''}" onclick="Screens.trends.setRange('all')">All</button>
      </div>

      <div class="chart-card"><h5>Bodyweight</h5><canvas class="chart-canvas" id="ch-bw"></canvas></div>
      <div class="chart-card"><h5>Resting HR</h5><canvas class="chart-canvas" id="ch-rhr"></canvas></div>
      <div class="chart-card"><h5>Sleep score</h5><canvas class="chart-canvas" id="ch-sleep"></canvas></div>
      <div class="chart-card"><h5>Knee rating</h5><canvas class="chart-canvas" id="ch-knee"></canvas></div>
    `;
  },
  setRange(r) { this.range = r; Router.refresh(); },
  onShow() { setTimeout(() => Screens.trends.drawAll(), 50); },
  drawAll() {
    const s = State.get();
    const sorted = [...s.logs].sort((a,b) => (a.date || '').localeCompare(b.date || ''));
    let data = sorted;
    if (Screens.trends.range === '4w') data = sorted.slice(-4);
    if (Screens.trends.range === '12w') data = sorted.slice(-12);
    Screens.trends.draw('ch-bw', data, 'bw', '#b04a2e');
    Screens.trends.draw('ch-rhr', data, 'rhr', '#2a3a44');
    Screens.trends.draw('ch-sleep', data, 'sleep', '#4a5d3a');
    Screens.trends.draw('ch-knee', data, 'knee', '#c89a3a');
  },
  draw(canvasId, data, key, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth;
    const cssH = 160;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    canvas.style.height = cssH + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, cssW, cssH);

    const points = data.map(d => ({ date: d.date, val: parseFloat(d[key]) })).filter(p => !isNaN(p.val));
    if (points.length < 2) {
      ctx.fillStyle = '#6a665d';
      ctx.font = '11px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.fillText(points.length === 0 ? 'No data — log check-ins' : 'Need 2+ entries', cssW/2, cssH/2);
      return;
    }

    const pad = { l: 36, r: 16, t: 16, b: 24 };
    const w = cssW - pad.l - pad.r;
    const h = cssH - pad.t - pad.b;
    const vals = points.map(p => p.val);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min || 1;
    const yMin = min - range * 0.15, yMax = max + range * 0.15;

    ctx.strokeStyle = '#cbc3b3';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.l, pad.t);
    ctx.lineTo(pad.l, pad.t + h);
    ctx.lineTo(pad.l + w, pad.t + h);
    ctx.stroke();

    ctx.fillStyle = '#6a665d';
    ctx.font = '9px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'right';
    for (let i = 0; i < 3; i++) {
      const yVal = yMin + (yMax - yMin) * (1 - i/2);
      const y = pad.t + h * (i/2);
      ctx.fillText(yVal.toFixed(1), pad.l - 6, y + 3);
      if (i > 0) {
        ctx.strokeStyle = '#ebe6db';
        ctx.beginPath();
        ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + w, y);
        ctx.stroke();
      }
    }

    ctx.fillStyle = color + '22';
    ctx.beginPath();
    points.forEach((p, i) => {
      const x = pad.l + (i / (points.length - 1)) * w;
      const y = pad.t + h - ((p.val - yMin) / (yMax - yMin)) * h;
      if (i === 0) { ctx.moveTo(x, pad.t + h); ctx.lineTo(x, y); }
      else ctx.lineTo(x, y);
    });
    ctx.lineTo(pad.l + w, pad.t + h);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    points.forEach((p, i) => {
      const x = pad.l + (i / (points.length - 1)) * w;
      const y = pad.t + h - ((p.val - yMin) / (yMax - yMin)) * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    ctx.fillStyle = color;
    points.forEach((p, i) => {
      const x = pad.l + (i / (points.length - 1)) * w;
      const y = pad.t + h - ((p.val - yMin) / (yMax - yMin)) * h;
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
    });

    ctx.fillStyle = '#6a665d';
    ctx.textAlign = 'center';
    const labels = points.length <= 4 ? points.map((_, i) => i) : [0, Math.floor((points.length-1)/2), points.length-1];
    labels.forEach(i => {
      const x = pad.l + (i / (points.length - 1)) * w;
      const d = points[i].date;
      ctx.fillText(d.length >= 10 ? d.substring(5) : d, x, pad.t + h + 16);
    });
  }
};

              <button class="${currentTheme === 'auto' ? 'active' : ''}" onclick="Screens.settings.setTheme('auto')">Auto</button>

      </div>

      <div class="settings-section">
        <h3 class="h3">Data</h3>
        <div class="settings-group">
          <button class="settings-row" onclick="Screens.settings.exportJSON()">
            <span>Export data</span>
            <span class="sr-meta">JSON</span>
          </button>

            <span>Import data</span>
            <span class="sr-meta">JSON</span>
          </button>

            <span class="sr-meta">${Database.tables.sessions.all().length}</span>
          </div>
          <div class="settings-row" style="cursor:default;">

          </div>
          <div class="settings-row" style="cursor:default;">
            <span>Reassessments</span>
            <span class="sr-meta">${Database.tables.reassessments.all().length}</span>
          </div>
          <div class="settings-row" style="cursor:default;">
            <span>Wearable readings</span>
            <span class="sr-meta">${Database.tables.wearableReadings.all().length}</span>
          </div>
          <div class="settings-row" style="cursor:default;">
            <span>AI recommendations</span>
            <span class="sr-meta">${Database.tables.aiRecommendations.all().length}</span>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h3 class="h3">About</h3>
        <div class="settings-group">
          <div class="settings-row" style="cursor:default;">
            <span>Schema version</span>
            <span class="sr-meta">v4 · structured</span>
          </div>
          <div class="settings-row" style="cursor:default;">
            <span>Version</span>
            <span class="sr-meta">4.0</span>
          </div>
          <div class="settings-row" style="cursor:default;">
            <span>Phase architecture</span>
            <span class="sr-meta">52 weeks</span>
          </div>
        </div>
      </div>

      <div class="callout">
        <strong>About this app</strong>
        Fully offline. No accounts, no servers, no tracking. Export your data regularly to back up — especially before the move abroad. localStorage can be cleared by the browser if you go months without opening the app.
      </div>
    `;
  },
  exportJSON() {
    const data = Database.services.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hybrid-training-v4-' + new Date().toISOString().substring(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  importJSON(e) {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!confirm('Replace your current data with this file?')) return;
        Database.services.importAll(data);
        alert('Imported.');
        Router.refresh();
      } catch (err) { alert('Not valid JSON.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  },
  resetAll() {
    if (!confirm('Delete ALL data? This cannot be undone.')) return;
    if (!confirm('Are you absolutely sure?')) return;
    State.actions.resetAll();
    Router.refresh();
    alert('All data cleared.');
  },
  setTheme(theme) {
    localStorage.setItem('htp_theme', theme);
    if (theme === 'auto') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', theme);
    }
    // Update theme-color meta for iOS chrome
    const dark = theme === 'dark' || (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#14110d' : '#f4f1ea');
    Router.refresh();
  }
};

   EXPOSE TO GLOBAL — inline onclick handlers run in window scope
   ============================================================ */
window.Storage = Storage;
window.Database = Database;
window.State = State;
window.Utils = Utils;
window.Plan = Plan;
window.Router = Router;
window.Screens = Screens;
window.SessionHelper = SessionHelper;

/* ============================================================
   BOOTSTRAP
   ============================================================ */
(function init() {
  // Apply saved theme preference
  const savedTheme = localStorage.getItem('htp_theme');
  if (savedTheme && savedTheme !== 'auto') {
    document.documentElement.setAttribute('data-theme', savedTheme);
  }
  // Sync theme-color meta on first load
  const isDark = (savedTheme === 'dark') ||
    (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.setAttribute('content', isDark ? '#14110d' : '#f4f1ea');

  // Start at home, or from hash if present
  const hash = (location.hash || '').replace('#', '');
  const startScreen = Screens[hash] ? hash : 'home';
  Router.switchTab(startScreen);
})();

// Re-draw charts on resize
window.addEventListener('resize', () => {
  const top = Router.getStack().slice(-1)[0];
  if (top && top.screenId === 'trends') setTimeout(Screens.trends.drawAll, 100);
});
</script>
